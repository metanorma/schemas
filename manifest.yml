    source: https://raw.githubusercontent.com/metanorma/standards-registry/main/schema/documents-index.schema.json
    title: Registry documents-index contract (v1)
  - path: registry/search-index/v1.json
    source: https://raw.githubusercontent.com/metanorma/standards-registry/main/schema/search-index.schema.json
    title: Registry search-index derived view (v1)
