name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://schemas.metanorma.org/
    steps:
      - uses: actions/checkout@v4

      - name: Stage schemas from their source repositories
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, yaml

          manifest = yaml.safe_load(open("manifest.yml"))["schemas"]
          site = pathlib.Path("site")
          for entry in manifest:
              data = urllib.request.urlopen(entry["source"], timeout=60).read()
              target = site / entry["path"]
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              json.loads(data)  # never publish malformed JSON
              print(f"staged {entry['path']} ({len(data)} bytes)")
          PY

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Generate schema documentation (lutaml-jsonschema)
        run: |
          # 0.1.19 shipped without frontend/dist; 0.1.21 is the first release with it
          gem install lutaml-jsonschema -v 0.1.21 --no-document
          python3 - <<'PY'
          import pathlib, subprocess, yaml

          data = yaml.safe_load(open("manifest.yml"))
          appearance = data.get("appearance", {})
          for entry in data["schemas"]:
              raw = pathlib.Path("site") / entry["path"]
              docs = pathlib.Path("site") / entry["path"].removesuffix(".json")
              config = pathlib.Path("docs-config.yml")
              config.write_text(yaml.safe_dump({
                  "title": entry["title"],
                  "theme": "light",
                  "appearance": {
                      "subtitle": appearance.get("subtitle"),
                      "logos": {"square": {
                          "light": {"url": appearance.get("logo_light")},
                          "dark": {"url": appearance.get("logo_dark")},
                      }},
                  },
              }))
              subprocess.run([
                  "lutaml-jsonschema", "spa", str(raw),
                  "--config", str(config),
                  "--output", str(docs),
              ], check=True)
          PY

      - name: Stage static assets
        run: cp -r assets site/assets

      - name: Generate index page
        run: |
          python3 generate_index.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
