name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://schemas.metanorma.org/
    steps:
      - uses: actions/checkout@v4

      - name: Stage schemas from their source repositories
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, yaml

          manifest = yaml.safe_load(open("manifest.yml"))["schemas"]
          site = pathlib.Path("site")
          rows = []
          for entry in manifest:
              data = urllib.request.urlopen(entry["source"], timeout=60).read()
              target = site / entry["path"]
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              json.loads(data)  # never publish malformed JSON
              rows.append((f"/{entry['path']}", entry["title"], entry["source"]))
              print(f"staged {entry['path']} ({len(data)} bytes)")

          listing = "\n".join(
              f"<li><a href='{p}'>{p}</a> — {t} "
              f"[<a href='{s}'>source</a>]</li>" for p, t, s in rows
          )
          (site / "index.html").write_text(f"""<!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8">
          <title>schemas.metanorma.org</title></head>
          <body><h1>schemas.metanorma.org</h1>
          <p>Canonical, versioned JSON Schema contracts of the Metanorma
          ecosystem. Sources live in their product repositories; this site
          is regenerated from <code>manifest.yml</code> on every change.</p>
          <ul>{listing}</ul>
          </body></html>""")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
